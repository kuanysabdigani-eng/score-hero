<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score! Hero 3 - Messi vs Yashin</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #0e1621;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: #eee;
            text-align: center;
            pointer-events: none;
            text-shadow: 0 3px 5px rgba(0,0,0,0.7);
            background: rgba(0,0,0,0.4);
            padding: 10px 25px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        h1 { margin: 0 0 5px 0; font-size: 26px; letter-spacing: 1px; color: #fff; }
        p { margin: 0; font-size: 16px; color: #ddd; }
        .highlight { color: #ff5588; font-weight: bold; }
        .yashin-text { color: #00ffff; font-weight: bold; }
    </style>
</head>
<body>

    <div id="ui">
        <h1>SCORE! HERO 3</h1>
        <p><span class="highlight">МЕССИ (№10)</span> пробивает пенальти против <span class="yashin-text">ЯШИНА</span>!</p>
    </div>

    <!-- Подключаем Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- Инициализация ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0e1621);
        scene.fog = new THREE.Fog(0x0e1621, 15, 60);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3.5, 10);
        camera.lookAt(0, 1.2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // --- Свет ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(8, 15, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // --- Поле ---
        const pitchGeo = new THREE.PlaneGeometry(22, 35);
        const pitchMat = new THREE.MeshStandardMaterial({ color: 0x227744, roughness: 0.9 });
        const pitch = new THREE.Mesh(pitchGeo, pitchMat);
        pitch.rotation.x = -Math.PI / 2;
        pitch.receiveShadow = true;
        scene.add(pitch);

        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        for(let i = 0; i < 6; i++) {
            const lineGeo = new THREE.PlaneGeometry(0.15, 35);
            const line = new THREE.Mesh(lineGeo, lineMat);
            line.rotation.x = -Math.PI / 2;
            line.position.set(i*4 - 10, 0.01, 0);
            scene.add(line);
        }

        // --- Ворота ---
        const goalGroup = new THREE.Group();
        goalGroup.position.set(0, 0, -14);
        
        const postMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const postGeo = new THREE.CylinderGeometry(0.12, 0.12, 4.2, 16);
        
        const leftPost = new THREE.Mesh(postGeo, postMat);
        leftPost.position.set(-3.1, 2.1, 0);
        leftPost.castShadow = true;
        
        const rightPost = new THREE.Mesh(postGeo, postMat);
        rightPost.position.set(3.1, 2.1, 0);
        rightPost.castShadow = true;

        const crossGeo = new THREE.CylinderGeometry(0.12, 0.12, 6.4, 16);
        crossGeo.rotateZ(Math.PI / 2);
        const crossbar = new THREE.Mesh(crossGeo, postMat);
        crossbar.position.set(0, 4.2, 0);
        crossbar.castShadow = true;

        const netGeo = new THREE.PlaneGeometry(6.2, 4.1);
        const netMat = new THREE.MeshBasicMaterial({ color: 0xcccccc, transparent: true, opacity: 0.3, side: THREE.DoubleSide });
        const net = new THREE.Mesh(netGeo, netMat);
        net.position.set(0, 2.1, -0.5);

        goalGroup.add(leftPost, rightPost, crossbar, net);
        scene.add(goalGroup);

        // --- Мяч ---
        const ballGeo = new THREE.SphereGeometry(0.42, 32, 32);
        const ballMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
        const ball = new THREE.Mesh(ballGeo, ballMat);
        ball.position.set(0, 0.42, 7);
        ball.castShadow = true;
        scene.add(ball);

        const shadowTexture = new THREE.TextureLoader().load('https://i.imgur.com/yN4ZzZl.png');
        const shadowSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: shadowTexture, transparent: true, opacity: 0.7 }));
        shadowSprite.scale.set(1.2, 1.2, 1);
        shadowSprite.position.set(0, 0.02, 7);
        scene.add(shadowSprite);

        // --- ЛИОНЕЛЬ МЕССИ (Игрок с №10) ---
        const messiGroup = new THREE.Group();
        messiGroup.position.set(0, 0, 7.8);
        scene.add(messiGroup);

        // Розовая форма Интер Майами
        const bodyGeo = new THREE.CylinderGeometry(0.3, 0.2, 1, 16);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff6699 }); 
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.8;
        body.castShadow = true;
        messiGroup.add(body);

        // Номер 10 на спине (текстура/плашка)
        const numGeo = new THREE.PlaneGeometry(0.3, 0.3);
        const numMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const numberPlate = new THREE.Mesh(numGeo, numMat);
        numberPlate.position.set(0, 0.9, -0.31);
        numberPlate.rotation.y = Math.PI;
        messiGroup.add(numberPlate);

        // Голова и борода (узнаваемый стиль Месси)
        const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
        const headGeo = new THREE.SphereGeometry(0.2, 16, 16);
        const head = new THREE.Mesh(headGeo, skinMat);
        head.position.y = 1.5;
        messiGroup.add(head);

        // Волосы и борода
        const hairMat = new THREE.MeshStandardMaterial({ color: 0x3d2314 });
        const hairGeo = new THREE.SphereGeometry(0.21, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2);
        const hair = new THREE.Mesh(hairGeo, hairMat);
        hair.position.y = 1.55;
        messiGroup.add(hair);

        const beardGeo = new THREE.BoxGeometry(0.18, 0.12, 0.18);
        const beard = new THREE.Mesh(beardGeo, hairMat);
        beard.position.set(0, 1.42, 0.1);
        messiGroup.add(beard);

        // Ноги
        const legGeo = new THREE.CylinderGeometry(0.1, 0.08, 0.8, 16);
        const shortsMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
        
        const leg1 = new THREE.Mesh(legGeo, skinMat);
        leg1.position.set(0.2, 0.4, 0);
        messiGroup.add(leg1);

        const leg2 = new THREE.Mesh(legGeo, skinMat);
        leg2.position.set(-0.2, 0.4, 0);
        leg2.rotation.x = -0.5; // Замахнулся
        messiGroup.add(leg2);


        // --- ВРАТАРЬ: ЛЕВ ЯШИН ---
        const keeperGroup = new THREE.Group();
        keeperGroup.position.set(0, 0, -13.5);
        scene.add(keeperGroup);

        const kBodyGeo = new THREE.CylinderGeometry(0.4, 0.3, 1.9, 16);
        const kBodyMat = new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 1 });
        const kBody = new THREE.Mesh(kBodyGeo, kBodyMat);
        kBody.position.y = 0.95;
        kBody.castShadow = true;
        keeperGroup.add(kBody);

        const kHeadGeo = new THREE.SphereGeometry(0.25, 16, 16);
        const kHead = new THREE.Mesh(kHeadGeo, skinMat);
        kHead.position.y = 2.1;
        keeperGroup.add(kHead);

        const capGeo = new THREE.CylinderGeometry(0.27, 0.2, 0.1, 16);
        const capMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
        const cap = new THREE.Mesh(capGeo, capMat);
        cap.position.set(0, 2.3, 0.05);
        keeperGroup.add(cap);

        // Буква "Д" на груди Яшина
        const dGeo = new THREE.PlaneGeometry(0.4, 0.4);
        const dTexture = new THREE.TextureLoader().load('https://i.imgur.com/93jG23a.png');
        const dMat = new THREE.MeshBasicMaterial({ map: dTexture, transparent: true });
        const dLogo = new THREE.Mesh(dGeo, dMat);
        dLogo.position.set(0, 1.1, 0.31);
        keeperGroup.add(dLogo);


        // --- Управление и Свайп ---

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let isDrawing = false;
        let points = [];
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0xff5588, linewidth: 3 });
        let trajectoryObject = null;

        let ballVelocity = new THREE.Vector3();
        let isFlying = false;
        let flightTime = 0;
        let flightDuration = 0.9; 
        let startPos = new THREE.Vector3();
        let peakPos = new THREE.Vector3();
        let targetPos = new THREE.Vector3();
        let messiKickAnim = 0;

        function getMousePos(e) {
            if (e.touches) {
                mouse.x = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
            } else {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            }
        }

        window.addEventListener('pointerdown', (e) => {
            if (isFlying) return;
            getMousePos(e);
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects([ball]);

            if (intersects.length > 0) {
                isDrawing = true;
                points = [ball.position.clone()];
                if(trajectoryObject) scene.remove(trajectoryObject);
            }
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDrawing) return;
            getMousePos(e);
            raycaster.setFromCamera(mouse, camera);
            const targetV3 = new THREE.Vector3();
            raycaster.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 1, 0), 0.4), targetV3);
            
            if (points.length < 20) {
                points.push(targetV3);
            } else {
                points.shift();
                points.push(targetV3);
            }
            
            if (points.length > 2) {
                const curve = new THREE.CatmullRomCurve3(points);
                const cPoints = curve.getPoints(50);
                const geom = new THREE.BufferGeometry().setFromPoints(cPoints);
                if(trajectoryObject) scene.remove(trajectoryObject);
                trajectoryObject = new THREE.Line(geom, lineMaterial);
                scene.add(trajectoryObject);
            }
        });

        window.addEventListener('pointerup', (e) => {
            if (!isDrawing) return;
            isDrawing = false;
            if(trajectoryObject) scene.remove(trajectoryObject);

            if (points.length > 5) {
                const last = points[points.length - 1];
                const first = points[points.length - 4];
                const dx = last.x - first.x;
                const dz = last.z - first.z;

                if (dz < -2) {
                    startKick(dx, dz);
                }
            }
        });

        function startKick(dx, dz) {
            isFlying = true;
            flightTime = 0;
            startPos.copy(ball.position);
            
            targetPos.x = THREE.MathUtils.clamp(dx * 6, -3, 3);
            targetPos.y = 0.42;
            targetPos.z = -13.8;

            peakPos.x = startPos.x + (targetPos.x - startPos.x) * 0.5;
            peakPos.y = 2.6; // Красивая дуга удара Месси
            peakPos.z = startPos.z + (targetPos.z - startPos.z) * 0.5;

            messiKickAnim = 1;
        }

        // --- Игровой цикл ---

        const clock = new THREE.Clock();
        let keeperState = 'idle';
        let keeperTimer = 0;
        let keeperMoveTarget = new THREE.Vector3();

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();

            // Анимация удара Месси
            if (messiKickAnim > 0) {
                messiKickAnim -= dt * 4;
                messiGroup.children[4].rotation.x = -0.5 - (Math.sin(messiKickAnim * Math.PI) * 1.6);
            }

            // Полет мяча
            if (isFlying) {
                flightTime += dt;
                let t = flightTime / flightDuration;
                if (t > 1) t = 1;

                const p0 = startPos;
                const p1 = peakPos;
                const p2 = targetPos;

                ball.position.x = (1-t)*(1-t)*p0.x + 2*(1-t)*t*p1.x + t*t*p2.x;
                ball.position.y = (1-t)*(1-t)*p0.y + 2*(1-t)*t*p1.y + t*t*p2.y;
                ball.position.z = (1-t)*(1-t)*p0.z + 2*(1-t)*t*p1.z + t*t*p2.z;
                
                ball.rotation.x -= dt * 12;

                shadowSprite.position.x = ball.position.x;
                shadowSprite.position.z = ball.position.z;
                shadowSprite.material.opacity = 0.7 - (ball.position.y * 0.2);

                if (t === 1) {
                    handleGoalResult();
                }
            }

            // Искусственный интеллект Яшина
            if(isFlying && keeperState === 'idle' && flightTime > 0.15) {
                keeperState = 'diving';
                keeperMoveTarget.x = THREE.MathUtils.clamp(targetPos.x * 0.85, -2.6, 2.6);
                keeperMoveTarget.y = THREE.MathUtils.clamp(targetPos.y + 1.1, 0.5, 2.3); 
                keeperMoveTarget.z = -13.3;
            }

            if(keeperState === 'diving') {
                 keeperTimer += dt;
                 keeperGroup.position.lerp(keeperMoveTarget, 0.12);
                 keeperGroup.rotation.y += 0.08;

                 if (ball.position.distanceTo(keeperGroup.position.clone().setZ(-14)) < 1.15) {
                     isFlying = false;
                     alert("ЛЕВ ЯШИН УГАДАЛ УДАР МЕССИ! Великий сейв!");
                     resetScene();
                 }
            }

            renderer.render(scene, camera);
        }

        function handleGoalResult() {
            isFlying = false;
            if (ball.position.x > -3.1 && ball.position.x < 3.1 && ball.position.y < 4.2) {
                alert("ГОЛ! Месси забивает легендарному Яшину!");
            } else {
                alert("Мимо ворот!");
            }
            resetScene();
        }

        function resetScene() {
            setTimeout(() => {
                ball.position.set(0, 0.42, 7);
                shadowSprite.position.set(0, 0.02, 7);
                
                keeperState = 'idle';
                keeperTimer = 0;
                keeperGroup.position.set(0, 0, -13.5);
                keeperGroup.rotation.set(0,0,0);

                messiGroup.children[4].rotation.x = -0.5;
            }, 600);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();

    </script>
</body>
</html>
