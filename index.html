<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score! Hero Web Prototype</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #111;
            font-family: sans-serif;
            touch-action: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        h1 { margin: 0 0 5px 0; font-size: 24px; }
        p { margin: 0; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>

    <div id="ui">
        <h1>SCORE! HERO WEB</h1>
        <p>Зажми экран, проведи линию от мяча и отпусти для удара!</p>
    </div>

    <!-- Подключаем Three.js и Cannon.js (для физики) через CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // Инициализация сцены, камеры и рендерера
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a2a3a);
        scene.fog = new THREE.Fog(0x1a2a3a, 20, 50);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 12);
        camera.lookAt(0, 1, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Свет
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Поле (Газон)
        const pitchGeo = new THREE.PlaneGeometry(20, 30);
        const pitchMat = new THREE.MeshStandardMaterial({ color: 0x2e8b57, roughness: 0.8 });
        const pitch = new THREE.Mesh(pitchGeo, pitchMat);
        pitch.rotation.x = -Math.PI / 2;
        pitch.receiveShadow = true;
        scene.add(pitch);

        // Ворота
        const goalGroup = new THREE.Group();
        goalGroup.position.set(0, 0, -12);
        
        const postMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const postGeo = new THREE.CylinderGeometry(0.1, 0.1, 4);
        
        const leftPost = new THREE.Mesh(postGeo, postMat);
        leftPost.position.set(-3, 2, 0);
        leftPost.castShadow = true;
        
        const rightPost = new THREE.Mesh(postGeo, postMat);
        rightPost.position.set(3, 2, 0);
        rightPost.castShadow = true;

        const crossGeo = new THREE.CylinderGeometry(0.1, 0.1, 6.2);
        crossGeo.rotateZ(Math.PI / 2);
        const crossbar = new THREE.Mesh(crossGeo, postMat);
        crossbar.position.set(0, 4, 0);
        crossbar.castShadow = true;

        goalGroup.add(leftPost, rightPost, crossbar);
        scene.add(goalGroup);

        // Мяч
        const ballGeo = new THREE.SphereGeometry(0.4, 32, 32);
        const ballMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
        const ball = new THREE.Mesh(ballGeo, ballMat);
        ball.position.set(0, 0.4, 6);
        ball.castShadow = true;
        scene.add(ball);

        // Вратарь
        const keeperGeo = new THREE.BoxGeometry(1, 2, 0.5);
        const keeperMat = new THREE.MeshStandardMaterial({ color: 0xff4500 });
        const keeper = new THREE.Mesh(keeperGeo, keeperMat);
        keeper.position.set(0, 1, -11.5);
        keeper.castShadow = true;
        scene.add(keeper);

        // Линия траектории (кривая на экране)
        const lineMat = new THREE.LineBasicMaterial({ color: 0xffff00, linewidth: 5 });
        let trajectoryLine = null;

        // Переменные для управления свайпом
        let isDragging = false;
        let startPoint = new THREE.Vector2();
        let currentPoint = new THREE.Vector2();
        let ballVelocity = new THREE.Vector3();
        let isMoving = false;

        // Обработка ввода (Мышь / Тач)
        window.addEventListener('pointerdown', (e) => {
            if (isMoving) return;
            isDragging = true;
            startPoint.set(e.clientX, e.clientY);
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            currentPoint.set(e.clientX, e.clientY);

            // Рисуем визуальный хвост траектории
            if (trajectoryLine) scene.remove(trajectoryLine);
            
            const points = [
                new THREE.Vector3(0, 0.4, 6),
                new THREE.Vector3((currentPoint.x - startPoint.x) * 0.02, 1, 6 - (currentPoint.y - startPoint.y) * 0.02)
            ];
            const geom = new THREE.BufferGeometry().setFromPoints(points);
            trajectoryLine = new THREE.Line(geom, lineMat);
            scene.add(trajectoryLine);
        });

        window.addEventListener('pointerup', (e) => {
            if (!isDragging) return;
            isDragging = false;

            if (trajectoryLine) {
                scene.remove(trajectoryLine);
                trajectoryLine = null;
            }

            // Вычисляем вектор удара на основе свайпа
            const dx = (e.clientX - startPoint.x) * 0.05;
            const dz = (e.clientY - startPoint.y) * 0.05;

            // Если свайп был вперед (в сторону ворот)
            if (dz < 0) {
                ballVelocity.set(dx * 0.3, 0.2, dz * 0.25); // Задаем скорость и легкую высоту
                isMoving = true;
            }
        });

        // Игровой цикл (Анимация)
        let clock = new THREE.Clock();
        let keeperDir = 1;

        function animate() {
            requestAnimationFrame(animate);

            // Движение вратаря туда-сюда
            keeper.position.x += keeperDir * 0.05;
            if (keeper.position.x > 2.2 || keeper.position.x < -2.2) {
                keeperDir *= -1;
            }

            // Полет мяча
            if (isMoving) {
                ball.position.add(ballVelocity);
                ball.rotation.x -= 0.1;

                // Проверка гола
                if (ball.position.z < -11.8) {
                    if (ball.position.x > -2.8 && ball.position.x < 2.8 && ball.position.y < 3.8) {
                        alert("ГОЛ! Отличный удар!");
                    } else {
                        alert("Мимо или в штангу!");
                    }
                    resetBall();
                }

                // Столкновение с вратарем (простая проверка)
                if (ball.position.distanceTo(keeper.position) < 1.0) {
                    alert("Вратарь отбил мяч!");
                    resetBall();
                }
            }

            renderer.render(scene, camera);
        }

        function resetBall() {
            isMoving = false;
            ball.position.set(0, 0.4, 6);
            ballVelocity.set(0, 0, 0);
        }

        animate();

        // Адаптация под изменение размера окна
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
